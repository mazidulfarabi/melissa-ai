[build]
  publish = "."
  functions = "functions"

# Reverse Proxy: routes all /api/* requests to the Cloudflare Workers AI backend
# Status 200 means Netlify serves it under your-site.netlify.app domain transparently!
[[redirects]]
  from = "/api/*"
  to = "https://melissa-ai.anmone-gaming.workers.dev/api/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
